function showDialog(title,body,cta=false){const c=CONTENT[lang];document.querySelector('#detail-content').innerHTML=`<div class="eyebrow">Atlant Capital Partners</div><h2 id="dialog-title">${title}</h2>${body}${cta?`<button class="button" data-discuss>${c.cta}</button>`:''}`;dialog.setAttribute('aria-labelledby','dialog-title');dialog.showModal();}
function closeMenu(){document.querySelector('#nav').classList.remove('open');document.querySelector('#menu').setAttribute('aria-expanded','false');}
document.addEventListener('click',e=>{const c=CONTENT[lang],b=e.target.closest('button');
 if(e.target.closest('#nav a'))closeMenu();if(!b)return;
 if(b.id==='menu'){const open=document.querySelector('#nav').classList.toggle('open');b.setAttribute('aria-expanded',String(open));}
 if(b.classList.contains('close'))dialog.close();
 if(b.hasAttribute('data-filter')){activeFilter=Number(b.dataset.filter);document.querySelectorAll('.filter').forEach(x=>{const on=Number(x.dataset.filter)===activeFilter;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on));});renderProjects();}
 if(b.hasAttribute('data-service')){const s=c.services[Number(b.dataset.service)];showDialog(s[0],`<p>${s[3]}</p><ul>${s[2].map(x=>`<li>${x}</li>`).join('')}</ul>`,true);}
 if(b.hasAttribute('data-project'))showDialog(c.projects[Number(b.dataset.project)][1],`<p>${c.projectDetail}</p>`,true);
 if(b.hasAttribute('data-legal'))showDialog(c[b.dataset.legal],`<p><strong>${c.legalDraft}</strong></p><p>${c[b.dataset.legal+'Text']}</p>`);
 if(b.hasAttribute('data-discuss')){dialog.close();location.hash='contact';document.querySelector('[name="name"]').focus({preventScroll:true});}
});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
language.addEventListener('change',()=>{const old=document.querySelector('#enquiry'),draft=new FormData(old),checked=old.querySelector('[type="checkbox"]').checked;lang=language.value;const u=new URL(location.href);u.searchParams.set('lang',lang);try{history.replaceState(null,'',u)}catch{}closeMenu();render();for(const [name,value] of draft){const field=document.querySelector(`[name="${name}"]`);if(field)field.value=value;}document.querySelector('#enquiry [type="checkbox"]').checked=checked;});
render();
</script>
